name: RustUI checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_web:
        description: Also run Web/Wasm release checks
        type: boolean
        default: false
      native_smoke_only:
        description: Run only native build and core tests (not release acceptance)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rustui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: github.event_name != 'workflow_dispatch' || !inputs.native_smoke_only
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Report disk space at job start
        run: df -h
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Normalize tracked file mtimes from Git history
        shell: bash
        run: |
          # Inline Python maps each tracked path to its newest reachable commit timestamp.
          python3 - <<'PY'
          import os
          import re
          import subprocess

          history = subprocess.check_output([
              "git", "log", "-z", "--format=%ct%x00", "--name-only"
          ])
          fields = history.split(b"\0")
          last_commit = {}
          timestamp = None
          index = 0
          while index < len(fields):
              field = fields[index]
              if (re.fullmatch(rb"[0-9]{9,10}", field)
                      and index + 1 < len(fields)
                      and fields[index + 1] == b""):
                  timestamp = int(field)
                  index += 2
                  continue
              index += 1
              if timestamp is None or not field:
                  continue
              path = field[1:] if field.startswith(b"\n") else field
              if path and path not in last_commit:
                  last_commit[path] = timestamp

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          normalized = 0
          for path in tracked:
              if not path or path not in last_commit:
                  continue
              try:
                  os.utime(path, (last_commit[path], last_commit[path]), follow_symlinks=False)
              except (FileNotFoundError, IsADirectoryError):
                  continue
              normalized += 1
          print(f"Normalized mtimes for {normalized} tracked files from their last Git commit time.")
          PY
      - name: Select existing Cargo cache paths
        id: cargo-cache-paths
        shell: bash
        run: |
          paths="target/headstart/debug"
          for candidate in "$HOME/.cargo/registry/index" "$HOME/.cargo/git"; do
            if [[ -d "$candidate" ]]; then
              paths+=$'\n'"$candidate"
            fi
          done
          {
            echo 'paths<<EOF'
            printf '%s\n' "$paths"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          printf 'Caching paths:\n%s\n' "$paths"
      - name: Cache Cargo build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.cargo-cache-paths.outputs.paths }}
          key: ${{ runner.os }}-headstart-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'patches/approved/*.json', 'patches/candidate-kit-0.9/**', 'scripts/check_kit09_core_stack.py', 'scripts/check_kit09_family_stack.py', 'scripts/tests/test_check_kit09_family_stack.py', 'scripts/fixture_target_dir.py', 'scripts/tests/test_fixture_target_dir.py', 'scripts/prepare_gpui_kit_09_fixture.py', 'scripts/data/gpui-kit-0.9.1-sources.json', 'scripts/tests/test_prepare_gpui_kit_09_fixture.py', 'scripts/tests/test_check_kit09_core_stack.py', 'crates/rustui-gpui*/**', 'crates/rustui-block/**', 'crates/rustui-cocoa*/**', 'crates/rustui-metal/**', 'crates/rustui-objc-foundation/**', 'vendor/gpui-*/**') }}-v3
          restore-keys: |
            ${{ runner.os }}-headstart-
      - name: Report disk space after cache restore
        run: df -h
      - name: Remove stale fixture caches from restored artifacts
        run: rm -rf "$HOME/.cache/rustui-target-fixture-kit8" "$HOME/.cache/rustui-target-fixture-kit9"
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Verify approved Tree sources, replay lifecycle, and source release gates
        run: ./scripts/verify-release.sh source
      - name: Test isolated GPUI fixture build targets
        run: python3 -m unittest scripts.tests.test_fixture_target_dir -v
      - name: Test the GPUI Kit 0.9.1 source fixture harness
        run: python3 -m unittest discover -s scripts/tests -p 'test_prepare_gpui_kit_09_fixture.py' -v
      - name: Verify the pinned GPUI Kit 0.9.1 source fixture
        run: python3 scripts/prepare_gpui_kit_09_fixture.py --fixture-dir "$RUNNER_TEMP/gpui-kit-0.9.1-fixture" --extract-crates
      - name: Test the GPUI Kit 0.9 core candidate stack
        run: python3 -m unittest scripts.tests.test_check_kit09_core_stack -v
      - name: Verify the GPUI Kit 0.9 core candidate stack
        run: python3 scripts/check_kit09_core_stack.py --compile-online --proof-core
      - name: Test the GPUI Kit 0.9 cumulative family stack
        run: python3 -m unittest scripts.tests.test_check_kit09_family_stack -v
      - name: Verify the GPUI Kit 0.9 cumulative family stack
        run: python3 scripts/check_kit09_family_stack.py --compile-online --proof-a3-4a --proof-a3-4b --proof-a3-4c --proof-a3-4d --proof-a3-4e --proof-a3-4f --proof-a3-4g --proof-a3-4i
      - name: Test the GPUI Fast candidate core and copied menu/select/tree/list/grid patches
        run: python3 -m unittest scripts.tests.test_f0_fast_core_stack -v
      - name: Verify the GPUI Fast candidate core patch stack
        run: python3 scripts/check_f0_fast_core_stack.py --check
      - name: Remove Kit 0.9 fixture build outputs after verification
        run: rm -rf "$HOME/.cache/rustui-target-fixture-kit9" "$RUNNER_TEMP/gpui-kit-0.9.1-fixture"
      - name: Stable Rust formatting, workspace check, and library tests
        run: ./scripts/check.sh
      - name: Report disk space at job end
        if: always()
        run: df -h

  # Run only after a maintainer selects a trusted revision. Never execute PR
  # code automatically on the persistent runner/toolchain cache.
  macos-and-web-builds:
    if: github.event_name == 'workflow_dispatch' && !inputs.native_smoke_only
    runs-on: [self-hosted, macOS, ARM64, rustui-headstart]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: false
      - name: Verify trusted checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: ./scripts/verify-ci-checkout.sh "$EXPECTED_SHA"
      - name: Provision Web binding tool on the trusted runner
        if: inputs.include_web
        run: ./scripts/provision-ci-wasm-bindgen.sh
      - name: Check Web binding tool before builds
        if: inputs.include_web
        run: ./scripts/build-playground-web.sh --check-bindgen
      - name: macOS checks and optimized package
        run: ./scripts/verify-release.sh macos
      - name: Web optimized bundle
        if: inputs.include_web
        run: ./scripts/verify-release.sh web

  native-mvp-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.native_smoke_only
    runs-on: [self-hosted, macOS, ARM64, rustui-headstart]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: false
      - name: Verify trusted checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: ./scripts/verify-ci-checkout.sh "$EXPECTED_SHA"
      - name: Render every registered Playground story
        run: rustup run 1.98.0 cargo test -p rustui-playground --lib every_registered_story_mounts_draws_and_exposes_its_title --locked --offline
      - name: Smoke the packaged Playground
        run: scripts/smoke-playground.sh
