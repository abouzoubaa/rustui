name: RustUI checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_web:
        description: Also run Web/Wasm release checks
        type: boolean
        default: false
      native_smoke_only:
        description: Run only native build and core tests (not release acceptance)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rustui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: github.event_name != 'workflow_dispatch' || !inputs.native_smoke_only
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Normalize tracked file mtimes from Git history
        shell: bash
        run: |
          # Inline Python maps each tracked path to its newest reachable commit timestamp.
          python3 - <<'PY'
          import os
          import re
          import subprocess

          history = subprocess.check_output([
              "git", "log", "-z", "--format=%ct%x00", "--name-only"
          ])
          fields = history.split(b"\0")
          last_commit = {}
          timestamp = None
          index = 0
          while index < len(fields):
              field = fields[index]
              if (re.fullmatch(rb"[0-9]{9,10}", field)
                      and index + 1 < len(fields)
                      and fields[index + 1] == b""):
                  timestamp = int(field)
                  index += 2
                  continue
              index += 1
              if timestamp is None or not field:
                  continue
              path = field[1:] if field.startswith(b"\n") else field
              if path and path not in last_commit:
                  last_commit[path] = timestamp

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          normalized = 0
          for path in tracked:
              if not path or path not in last_commit:
                  continue
              try:
                  os.utime(path, (last_commit[path], last_commit[path]), follow_symlinks=False)
              except (FileNotFoundError, IsADirectoryError):
                  continue
              normalized += 1
          print(f"Normalized mtimes for {normalized} tracked files from their last Git commit time.")
          PY
      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: ". -> target/headstart"
          cache-workspace-crates: true
          # Bumped once for CI-CACHE-2 cold/warm measurement; bump to force a new cache seed.
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'patches/approved/*.json') }}-ci-cache-2-v1
      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Verify approved Tree sources, replay lifecycle, and source release gates
        run: ./scripts/verify-release.sh source
      - name: Test the GPUI Kit 0.8.1 source fixture harness
        run: python3 -m unittest discover -s scripts/tests -p 'test_prepare_gpui_kit_08_fixture.py' -v
      - name: Test the GPUI Kit 0.8 core patch stack
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_kit08_core_stack.py' -v
      - name: Verify the GPUI Kit 0.8 core candidate stack
        run: python3 scripts/check_kit08_core_stack.py
      - name: Stable Rust formatting, workspace check, and library tests
        run: ./scripts/check.sh

  # Run only after a maintainer selects a trusted revision. Never execute PR
  # code automatically on the persistent runner/toolchain cache.
  macos-and-web-builds:
    if: github.event_name == 'workflow_dispatch' && !inputs.native_smoke_only
    runs-on: [self-hosted, macOS, ARM64, rustui-headstart]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: false
      - name: Verify trusted checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: ./scripts/verify-ci-checkout.sh "$EXPECTED_SHA"
      - name: Provision Web binding tool on the trusted runner
        if: inputs.include_web
        run: ./scripts/provision-ci-wasm-bindgen.sh
      - name: Check Web binding tool before builds
        if: inputs.include_web
        run: ./scripts/build-playground-web.sh --check-bindgen
      - name: macOS checks and optimized package
        run: ./scripts/verify-release.sh macos
      - name: Web optimized bundle
        if: inputs.include_web
        run: ./scripts/verify-release.sh web

  native-mvp-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.native_smoke_only
    runs-on: [self-hosted, macOS, ARM64, rustui-headstart]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: false
      - name: Verify trusted checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: ./scripts/verify-ci-checkout.sh "$EXPECTED_SHA"
      - name: Render every registered Playground story
        run: rustup run 1.97.1 cargo test -p rustui-playground --lib every_registered_story_mounts_draws_and_exposes_its_title --locked --offline
      - name: Smoke the packaged Playground
        run: scripts/smoke-playground.sh
