[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[package]
name = "rustui-external-consumer-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rustui = { path = "../../crates/rustui" }

# Carry the SDK's scoped workaround; profile settings are not inherited across
# workspace boundaries, and the macro crate still needs this setting.
[profile.dev.package.rustui-macros]
incremental = false

[profile.headstart]
inherits = "dev"
debug = 1
incremental = true

[profile.headstart.package.rustui-macros]
incremental = false
