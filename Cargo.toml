[workspace]
resolver = "3"
members = [
    "crates/rustui",
    "crates/rustui-core",
    "crates/rustui-macros",
    "crates/rustui-i18n",
    "crates/rustui-rgpe",
    "apps/rustui-lab",
    "apps/rustui-playground",
]
default-members = ["crates/rustui", "apps/rustui-playground"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
rustui = { path = "crates/rustui" }
rustui-core = { path = "crates/rustui-core" }
rustui-i18n = { path = "crates/rustui-i18n" }
rustui-macros = { path = "crates/rustui-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = "=0.4.45"

# Approved Zed snapshot, repackaged by Longbridge; see docs/UPSTREAM_AUDIT.md.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
gpui-component = { version = "=0.7.3", default-features = false }
gpui-base = { version = "=0.7.3", default-features = false }
gpui-kit-assets = "=0.7.3"

[patch.crates-io]
# Keep upstream package versions pinned while reproducibly applying the
# approved GPUI accessibility patches; see patches/README.md.
gpui-pre = { path = "vendor/gpui-pre-0.3.9" }
gpui-base = { path = "vendor/gpui-base-0.7.3" }
gpui-component = { path = "vendor/gpui-component-0.7.3" }
gpui-pre-web = { path = "vendor/gpui-pre-web-0.3.9" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos-0.3.9" }

[profile.headstart]
inherits = "dev"
debug = 1
incremental = true

# Headstart's early/full metadata path can produce an SVH mismatch for a changed
# proc-macro crate even with the approved metadata-hash workaround. Keep the
# workspace cache incremental while compiling only RustUI's small macro crate
# without incremental state.
[profile.dev.package.rustui-macros]
incremental = false

[profile.headstart.package.rustui-macros]
incremental = false
