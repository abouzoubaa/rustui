[workspace]
resolver = "3"
exclude = [
    "crates/rustui-gpui-fast-macros",
    "crates/rustui-gpui-fast-apple",
    "crates/rustui-gpui-fast-macos",
    "crates/rustui-gpui-fast-platform",
    "crates/rustui-gpui-fast",
    "crates/rustui-gpui",
    "crates/rustui-gpui-base",
    "crates/rustui-gpui-component",
    "crates/rustui-gpui-kit-assets",
    "crates/rustui-gpui-linux",
    "crates/rustui-gpui-web",
    "crates/rustui-gpui-wgpu",
    "crates/rustui-gpui-windows",
]
members = [
    "crates/rustui",
    "crates/rustui-core",
    "crates/rustui-macros",
    "crates/rustui-i18n",
    "crates/rustui-rgpe",
    "apps/rustui-lab",
    "apps/rustui-playground",
]
default-members = ["crates/rustui", "apps/rustui-playground"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
publish = false

[workspace.dependencies]
rustui = { path = "crates/rustui" }
rustui-core = { path = "crates/rustui-core" }
rustui-i18n = { path = "crates/rustui-i18n" }
rustui-macros = { path = "crates/rustui-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = "=0.4.45"

# Approved Zed snapshot, repackaged by Longbridge; see docs/UPSTREAM_AUDIT.md.
gpui = { package = "gpui-fast", path = "crates/rustui-gpui-fast", version = "=0.1.14" }
gpui_platform = { package = "gpui-fast-platform", path = "crates/rustui-gpui-fast-platform", version = "=0.1.14", features = ["font-kit", "runtime_shaders"] }
gpui-component = { path = "crates/rustui-gpui-component", version = "=0.9.1", default-features = false, features = ["gpui-fast"] }
gpui-base = { package = "gpui-base", path = "crates/rustui-gpui-base", version = "=0.9.1", default-features = false, features = ["gpui-fast"] }
gpui-kit-assets = { path = "crates/rustui-gpui-kit-assets", version = "=0.9.1", features = ["gpui-fast"] }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

[patch.crates-io]
# Normalize dormant registry references to the same owned macOS Fast packages.
gpui-fast = { path = "crates/rustui-gpui-fast" }
gpui-fast-platform = { path = "crates/rustui-gpui-fast-platform" }
gpui-fast-macos = { path = "crates/rustui-gpui-fast-macos" }
gpui-fast-apple = { path = "crates/rustui-gpui-fast-apple" }
gpui-fast-macros = { path = "crates/rustui-gpui-fast-macros" }
cosmic-text = { path = "vendor/cosmic-text-0.19.0" }
# Keep upstream package versions pinned while reproducibly applying the
# approved GPUI patches; see patches/README.md.

[profile.release]
lto = "thin"
codegen-units = 1

[profile.headstart]
inherits = "dev"
debug = 1
incremental = true

# Headstart's early/full metadata path can produce an SVH mismatch for
# rustui-macros even with the approved metadata-hash workaround.
# Keep workspace incrementality enabled; disable it only in the explicit
# Headstart profile below.
[profile.headstart.package.rustui-macros]
incremental = false
