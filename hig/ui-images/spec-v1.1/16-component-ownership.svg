<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><title>Independent RustUI component owners and retained control state</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#267d7b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="28" y="34" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start">COMPONENT OWNERSHIP IS NOT DESCRIPTION NESTING</text><rect x="170" y="65" width="660" height="115" rx="12" fill="#edf5f5" stroke="#8ba5ad" stroke-width="1.5"/><text x="188" y="97" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">GPUI Entity&lt;ComponentHost&lt;CounterScreen&gt;&gt;</text><text x="188" y="126" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Parent owns its own fields and a scoped child registry.</text><text x="188" y="152" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">A parent body rebuild is not a child state reset.</text><path d="M330,188 L252,242" fill="none" stroke="#267d7b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M670,188 L750,242" fill="none" stroke="#267d7b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="251" width="445" height="149" rx="12" fill="#edf5f5" stroke="#8ba5ad" stroke-width="1.5"/><text x="46" y="283" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">Component("left", Counter::default)</text><text x="46" y="312" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Separate GPUI ComponentHost&lt;Counter&gt;</text><text x="46" y="338" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">count = 2  •  local actions target LEFT</text><text x="46" y="364" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Same scoped key + type → retain host.</text><rect x="527" y="251" width="445" height="149" rx="12" fill="#edf5f5" stroke="#8ba5ad" stroke-width="1.5"/><text x="545" y="283" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">Component("right", Counter::default)</text><text x="545" y="312" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Separate GPUI ComponentHost&lt;Counter&gt;</text><text x="545" y="338" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">count = 1  •  local actions target RIGHT</text><text x="545" y="364" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Initializer runs only for a new slot.</text><path d="M250,408 L250,459" fill="none" stroke="#267d7b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M748,408 L748,459" fill="none" stroke="#267d7b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="469" width="445" height="106" rx="12" fill="#eaf0f8" stroke="#8ba5ad" stroke-width="1.5"/><text x="46" y="501" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">Left body and native controls</text><text x="46" y="530" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Temporary VStack / Label / Buttons</text><text x="46" y="556" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Retained editing entities when needed.</text><rect x="527" y="469" width="445" height="106" rx="12" fill="#eaf0f8" stroke="#8ba5ad" stroke-width="1.5"/><text x="545" y="501" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">Right body and native controls</text><text x="545" y="530" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Temporary VStack / Label / Buttons</text><text x="545" y="556" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Independent control state and callbacks.</text><text x="28" y="619" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">Keyed(key, view) scopes identity; it does not create another owner.</text><text x="28" y="651" fill="#526d7b" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">A control .id(...) is local to its native retention scope.</text><text x="28" y="684" fill="#526d7b" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Exact parent targeting uses OwnerAction, not a local Action moved across hosts.</text></svg>