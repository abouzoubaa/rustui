<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><title>Method action creation is separate from mutable event dispatch</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#267d7b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="28" y="34" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start">READ-ONLY BODY, LATER MUTABLE ACTION</text><rect x="28" y="69" width="442" height="132" rx="12" fill="#edf5f5" stroke="#8ba5ad" stroke-width="1.5"/><text x="46" y="101" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">During body(&amp;self)</text><text x="46" y="130" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Button("Increment",</text><text x="46" y="156" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">    self.action(Self::increment))</text><text x="46" y="182" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Create a descriptor; do not mutate count.</text><rect x="530" y="69" width="442" height="132" rx="12" fill="#edf5f5" stroke="#8ba5ad" stroke-width="1.5"/><text x="548" y="101" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">During native lowering</text><text x="548" y="130" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Bind the descriptor to this host updater.</text><text x="548" y="156" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Callback holds a weak GPUI owner.</text><text x="548" y="182" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">The body borrow is not kept for later.</text><path d="M478,130 L521,130" fill="none" stroke="#267d7b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="258" width="442" height="133" rx="12" fill="#edf5f5" stroke="#8ba5ad" stroke-width="1.5"/><text x="548" y="290" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">When the user activates Button</text><text x="548" y="319" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Upgrade current weak owner.</text><text x="548" y="345" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">GPUI supplies mutable host access.</text><text x="548" y="371" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">increment(&amp;mut Counter) runs now.</text><path d="M751,209 L751,249" fill="none" stroke="#267d7b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="258" width="442" height="133" rx="12" fill="#edf5f5" stroke="#8ba5ad" stroke-width="1.5"/><text x="46" y="290" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">After the method returns</text><text x="46" y="319" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Action → notify the whole host.</text><text x="46" y="345" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">action_if_changed → notify if true.</text><text x="46" y="371" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">A later pass reads the updated count.</text><path d="M521,320 L479,320" fill="none" stroke="#267d7b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="444" width="944" height="86" rx="12" fill="#eaf0f8" stroke="#8ba5ad" stroke-width="1.5"/><text x="46" y="476" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">Different boundary: exact-instance parent actions</text><text x="49" y="505" fill="#526d7b" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">OwnerActionReader addresses the parent entity; local Action alone does not.</text></svg>