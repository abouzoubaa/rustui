<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><title>RustUI: declare, construct, mount, describe and lower</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#267d7b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="28" y="34" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start">DECLARATIVE COMPONENT LIFECYCLE</text><rect x="28" y="60" width="440" height="136" rx="12" fill="#edf5f5" stroke="#8ba5ad" stroke-width="1.5"/><text x="46" y="92" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">1  Declare and compile</text><text x="46" y="121" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">#[component] + #[state(0)]</text><text x="46" y="147" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Generate Default, accessors and actions.</text><text x="46" y="173" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">No GPUI entity or window yet.</text><rect x="532" y="60" width="440" height="136" rx="12" fill="#edf5f5" stroke="#8ba5ad" stroke-width="1.5"/><text x="550" y="92" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">2  Construct the value</text><text x="550" y="121" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Counter::default()</text><text x="550" y="147" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Ordinary Rust struct; count = 0.</text><text x="550" y="173" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Construction is not native mounting.</text><path d="M474,125 L523,125" fill="none" stroke="#267d7b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="532" y="239" width="440" height="136" rx="12" fill="#edf5f5" stroke="#8ba5ad" stroke-width="1.5"/><text x="550" y="271" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">3  Mount an owned root</text><text x="550" y="300" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">RustUI::new().run(counter)</text><text x="550" y="326" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">GPUI Entity&lt;ComponentHost&lt;Counter&gt;&gt;</text><text x="550" y="352" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Established theme and Root setup.</text><path d="M752,202 L752,230" fill="none" stroke="#267d7b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="239" width="440" height="136" rx="12" fill="#edf5f5" stroke="#8ba5ad" stroke-width="1.5"/><text x="46" y="271" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">4  Evaluate its body</text><text x="46" y="300" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">body(&amp;self) -&gt; impl View</text><text x="46" y="326" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Temporary stacks, Label and Buttons.</text><text x="46" y="352" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">The component and count persist.</text><path d="M523,305 L477,305" fill="none" stroke="#267d7b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="420" width="440" height="134" rx="12" fill="#edf5f5" stroke="#8ba5ad" stroke-width="1.5"/><text x="46" y="452" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">5  Lower through native adapters</text><text x="46" y="481" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">RenderContext + GPUI elements</text><text x="46" y="507" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Retrieve retained native control state.</text><text x="46" y="533" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">GPUI owns layout, drawing and input.</text><path d="M250,383 L250,411" fill="none" stroke="#267d7b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="532" y="420" width="440" height="134" rx="12" fill="#edf5f5" stroke="#8ba5ad" stroke-width="1.5"/><text x="550" y="452" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">6  Dispatch a later action</text><text x="550" y="481" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">self.action(Self::increment)</text><text x="550" y="507" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Mutate the owning component.</text><text x="550" y="533" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Notify the GPUI component host.</text><path d="M477,486 L523,486" fill="none" stroke="#267d7b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M532,445 L503,445 L503,398 L444,398 L444,378" fill="none" stroke="#267d7b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="599" width="944" height="76" rx="12" fill="#eaf0f8" stroke="#8ba5ad" stroke-width="1.5"/><text x="46" y="631" fill="#163745" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">Repeat steps 4–6; the mounted owner and state survive.</text><text x="48" y="654" fill="#526d7b" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Ordinary interaction is H0 runtime behavior, not source hot reload.</text></svg>